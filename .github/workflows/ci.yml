name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightops
          POSTGRES_PASSWORD: insightops
          POSTGRES_DB: insightops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insightops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap read-only role and schemas
        env:
          PGPASSWORD: insightops
        run: psql -h localhost -U insightops -d insightops -f db-init/01-init.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://insightops:insightops@localhost:5432/insightops
          ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_readonly:analytics_readonly@localhost:5432/insightops
          JWT_SECRET_KEY: ci-test-secret
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
